title: { mr: गजमुखासुर आणि कुबेराचा गर्व, hi: गजमुखासुर और कुबेर का गर्व, en: Gajamukhasura and Kubera's pride }
facts:
  - "Gajamukhasura was a demon with an elephant's face who had a boon making him nearly invincible against weapons. Ganesha broke off his own tusk and hurled it at him; the demon was subdued and became Ganesha's mouse in some tellings."
  - "The Kubera story: Kubera, lord of wealth, proud of his riches, invited Shiva to a grand feast to display them. Shiva declined and sent Ganesha instead."
  - "Ganesha ate everything Kubera's kitchens could produce and was still hungry, consuming the furnishings and finally threatening to eat Kubera himself. Kubera, humbled, ran to Shiva."
  - "Shiva gave him a single handful of roasted rice offered with humility, which satisfied Ganesha completely. The moral usually drawn: what is given with ego cannot satisfy, what is given with humility can."
  - "This story is often told to children during the festival, and is the reason a simple naivedya offered sincerely is held equal to an elaborate one."
