title:
  sa: गणपत्यथर्वशीर्ष
  mr: गणपती अथर्वशीर्ष
  hi: गणपति अथर्वशीर्ष
  en: Ganapati Atharvashirsha
text:
  devanagari: |
    ॐ नमस्ते गणपतये ॥१॥
    त्वमेव प्रत्यक्षं तत्त्वमसि ।
    त्वमेव केवलं कर्ताऽसि ।
    त्वमेव केवलं धर्ताऽसि ।
    त्वमेव केवलं हर्ताऽसि ।
    त्वमेव सर्वं खल्विदं ब्रह्मासि ।
    त्वं साक्षादात्माऽसि नित्यम् ॥२॥
    ऋतं वच्मि । सत्यं वच्मि ॥३॥
    अव त्वं माम् ।
    अव वक्तारम् ।
    अव श्रोतारम् ।
    अव दातारम् ।
    अव धातारम् ।
    अवानूचानमव शिष्यम् ।
    अव पुरस्तात् ।
    अव दक्षिणात्तात् ।
    अव पश्चात्तात् ।
    अवोत्तरात्तात् ।
    अव चोर्ध्वात्तात् ।
    अवाधरात्तात् ।
    सर्वतो मां पाहि पाहि समन्तात् ॥४॥
    त्वं वाङ्मयस्त्वं चिन्मयः ।
    त्वमानन्दमयस्त्वं ब्रह्ममयः ।
    त्वं सच्चिदानन्दाऽद्वितीयोऽसि ।
    त्वं प्रत्यक्षं ब्रह्मासि ।
    त्वं ज्ञानमयो विज्ञानमयोऽसि ॥५॥
    सर्वं जगदिदं त्वत्तो जायते ।
    सर्वं जगदिदं त्वत्तस्तिष्ठति ।
    सर्वं जगदिदं त्वयि लयमेष्यति ।
    सर्वं जगदिदं त्वयि प्रत्येति ।
    त्वं भूमिरापोऽनलोऽनिलो नभः ।
    त्वं चत्वारि वाक् परिमिता पदानि ॥६॥
    त्वं गुणत्रयातीतः ।
    त्वम् अवस्थात्रयातीतः ।
    त्वं देहत्रयातीतः ।
    त्वं कालत्रयातीतः ।
    त्वं मूलाधारस्थितोऽसि नित्यम् ।
    त्वं शक्तित्रयात्मकः ।
    त्वां योगिनो ध्यायन्ति नित्यम् ॥७॥
    त्वं ब्रह्मा त्वं विष्णुस्त्वं रुद्रस्त्वमिन्द्रस्त्वमग्निस्त्वं वायुस्त्वं सूर्यस्त्वं चन्द्रमास्त्वं ब्रह्म भूर्भुवस्सुवरोम् ॥८॥
    गणादिं पूर्वमुच्चार्य वर्णादींस्तदनन्तरम् ।
    अनुस्वारः परतरः ।
    अर्धेन्दुलसितम् ।
    तारेण ऋद्धम् ।
    एतत्तव मनुस्वरूपम् ॥९॥
    गकारः पूर्वरूपम् ।
    अकारो मध्यरूपम् ।
    अनुस्वारश्चान्त्यरूपम् ।
    बिन्दुरुत्तररूपम् ।
    नादस्संधानम् ।
    सग्ंहिता संधिः ॥१०॥
    सैषा गणेशविद्या ।
    गणक ऋषिः ।
    निचृद्गायत्रीच्छन्दः ।
    गणपतिर्देवता ।
    ॐ गं गणपतये नमः ॥११॥
    एकदन्ताय विद्महे वक्रतुण्डाय धीमहि ।
    तन्नो दन्तिः प्रचोदयात् ॥१२॥
    एकदन्तं चतुर्हस्तं पाशमङ्कुशधारिणम् ।
    रदं च वरदं हस्तैर्बिभ्राणं मूषकध्वजम् ॥
    रक्तं लम्बोदरं शूर्पकर्णकं रक्तवाससम् ।
    रक्तगन्धानुलिप्ताङ्गं रक्तपुष्पैस्सुपूजितम् ॥१३॥
    भक्तानुकम्पिनं देवं जगत्कारणमच्युतम् ।
    आविर्भूतं च सृष्ट्यादौ प्रकृतेः पुरुषात्परम् ।
    एवं ध्यायति यो नित्यं स योगी योगिनां वरः ॥१४॥
    नमो व्रातपतये ।
    नमो गणपतये ।
    नमः प्रमथपतये ।
    नमस्तेऽस्तु लम्बोदरायैकदन्ताय विघ्ननाशिने शिवसुताय वरदमूर्तये नमः ॥१५॥
    एतदथर्वशीर्षं योऽधीते स ब्रह्मभूयाय कल्पते ।
    स सर्वविघ्नैर्न बाध्यते ।
    स सर्वत्र सुखमेधते ।
    स पञ्चमहापापात्प्रमुच्यते ॥१६॥
    सायमधीयानो दिवसकृतं पापं नाशयति ।
    प्रातरधीयानो रात्रिकृतं पापं नाशयति ।
    सायं प्रातः प्रयुञ्जानो पापोऽपापो भवति ।
    सर्वत्राधीयानोऽपविघ्नो भवति ।
    धर्मार्थकाममोक्षं च विन्दति ॥१७॥
    इदमथर्वशीर्षमशिष्याय न देयम् ।
    यो यदि मोहाद्दास्यति स पापीयान् भवति ।
    सहस्रावर्तनाद्यं यं काममधीते तं तमनेन साधयेत् ॥१८॥
    अष्टौ ब्राह्मणान् सम्यग् ग्राहयित्वा सूर्यवर्चस्वी भवति ।
    सूर्यग्रहेमहानद्यां प्रतिमासन्निधौ वा जप्त्वा सिद्धमन्त्रो भवति ।
    महाविघ्नात् प्रमुच्यते ।
    महादोषात् प्रमुच्यते ।
    महाप्रत्यवायात् प्रमुच्यते ।
    स सर्वविद् भवति स सर्वविद् भवति ।
    य एवं वेद ।
    इत्युपनिषत् ॥१९॥
    ॐ शान्तिः शान्तिः शान्तिः ॥
  roman_simple: |
    Om Namaste Ganapataye |
    Tvameva Pratyaksham Tattvamasi |
    Tvameva Kevalam Kartasi |
    Tvameva Kevalam Dhartasi |
    Tvameva Kevalam Hartasi |
    Tvameva Sarvam Khalvidam Brahmasi |
    Tvam Sakshadatmasi Nityam || 1 ||
    Ritam Vachmi | Satyam Vachmi || 2 ||
meaning:
  en: "Om, salutations to Ganapati. You alone are the manifest principle. You alone are the creator, the sustainer, the dissolver. You alone are truly all this Brahman. You are the Self, directly and eternally. I speak the cosmic order; I speak the truth. Protect me, protect the speaker, the listener, the giver, the sustainer, the pupil; protect me from behind, in front, from the north and south, from above and below — protect me from every side."
  mr: "ॐ गणपतीला नमस्कार. तूच प्रत्यक्ष तत्त्व आहेस. तूच एकमेव कर्ता, धर्ता आणि हर्ता आहेस. हे सर्व ब्रह्म तूच आहेस. तू नित्य आत्मा आहेस. मी ऋत बोलतो, मी सत्य बोलतो. माझे सर्व बाजूंनी रक्षण कर."
  hi: "ॐ गणपति को नमस्कार. तुम ही प्रत्यक्ष तत्त्व हो. तुम ही कर्ता, धर्ता और हर्ता हो. यह सब ब्रह्म तुम ही हो. तुम नित्य आत्मा हो. मैं ऋत कहता हूँ, मैं सत्य कहता हूँ. मेरी सब ओर से रक्षा करो."
usage:
  when: "Recited daily by many Maharashtrian families, and especially during Ganeshotsav. Group recitation (samuhik atharvashirsha pathan) on Sankashti and during the festival is a strong Maharashtra tradition."
  count: "1, 11, or 21 times. 'Sahasravartan' (1000 recitations by a group) is performed as a special sankalpa."
notes_en: "Complete text, sections 1-19 plus the closing shanti, taken from a single consistent edition. NOTE: editions differ in how they number the early sections — some merge sections 1-2 and renumber, so the same words may carry different section numbers elsewhere. Do not mix editions."
