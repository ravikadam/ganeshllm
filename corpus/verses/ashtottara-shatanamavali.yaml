    ॐ सर्वैश्वर्यप्रदाय नमः ।
    ॐ आक्रान्तचिदचित्प्रभवे नमः ।
    ॐ श्री विघ्नेश्वराय नमः ।
  roman_simple: |
    Om Gajananaya Namah | Om Ganadhyakshaya Namah | Om Vighnarajaya Namah |
    Om Vinayakaya Namah | Om Dvaimaturaya Namah | Om Dvimukhaya Namah |
    Om Pramukhaya Namah | Om Sumukhaya Namah | Om Kritine Namah |
meaning:
  en: "The 108 names, each offered with 'Om ... namah'. They name Ganesha as elephant-faced, lord of the ganas, king over obstacles, born of two mothers, great-bellied, short-necked, and so on — each name a distinct aspect."
  mr: "१०८ नावे, प्रत्येक 'ॐ ... नमः' या रूपात. प्रत्येक नाव गणेशाच्या एका वेगळ्या रूपाचे वर्णन करते."
  hi: "१०८ नाम, प्रत्येक 'ॐ ... नमः' के रूप में. हर नाम गणेश के एक अलग रूप का वर्णन करता है."
usage:
  when: "Recited during archana, offering a durva or a flower at each name."
  count: "All 108, once."
notes_en: "Full text verified against independent public sources on 2026-08-26."
