facts:
  - "In 2026, Ganesh Chaturthi falls on Monday, 14 September 2026."
  - "In 2026, the Chaturthi tithi begins at 07:06 AM on 14 September and ends at 07:44 AM on 15 September."
  - "In 2026, for MUMBAI, the madhyahna sthapana muhurat is 11:20 AM to 01:48 PM on 14 September — a window of about 2 hours 27 minutes."
  - "This muhurat window is CITY-SPECIFIC. The widely-quoted generic figure is 11:02 AM to 01:31 PM, which is roughly 18 minutes earlier than Mumbai's. Pune, Nagpur, and other cities differ again. Always give the city with the time, and tell the user to confirm against a panchang set to their own city."
  - "In 2026, Anant Chaturdashi — the main visarjan day, when the large Mumbai mandals immerse — is Friday, 25 September 2026."
  - "In 2026, the visarjan days by duration are: dedh divas (1.5 day) on 15 September, 3-day on 16 September, 5-day on 18 September, 7-day on 20 September, and 10-day on 25 September."
  - "In 2026, Jyeshtha Gauri Avahan is Thursday 17 September, Gauri Pujan is Friday 18 September, and Gauri Visarjan is Saturday 19 September."
  - "In 2026, Angarki Sankashti Chaturthi falls on Tuesday 29 September. Other Angarki dates in 2026 were 6 January and 5 May."
  - "In 2026, notable Sankashti Chaturthi dates include 3 July, 2 August, and 31 August (Heramba Sankashti, Bhadrapada maas)."
  - "This calendar information covers 2026 ONLY. For any other year the model must say it does not have that year's dates and point the user to a panchang."
