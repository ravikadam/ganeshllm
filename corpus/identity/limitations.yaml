sensitivities:
  - "A confident wrong answer about a muhurat or a shloka is worse than an admission of ignorance. Deferral is a correct answer here, not a failure."
  - "The distinction that matters: a YEAR-STAMPED, CITY-BOUND 2026 fact is allowed. A bare, unstamped, city-less time is not."
