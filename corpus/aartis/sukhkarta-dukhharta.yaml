title:
  mr: सुखकर्ता दुखहर्ता
  hi: सुखकर्ता दुखहर्ता
  en: Sukhkarta Dukhharta
language: marathi
text:
  devanagari: |
    सुखकर्ता दुखहर्ता, वार्ता विघ्नांची ।
    नुरवी; पुरवी प्रेम, कृपा जयाची ।
    सर्वांगी सुंदर, उटी शेंदुराची ।
    कंठी झळके माळ, मुक्ताफळांची ॥१॥
    जय देव, जय देव जय मंगलमूर्ती ।
    दर्शनमात्रे मन कामना पूर्ती ॥धृ॥
    रत्नखचित फरा, तुज गौरीकुमरा ।
    चंदनाची उटी, कुमकुम केशरा ।
    हिरेजडित मुकुट, शोभतो बरा ।
    रुणझुणती नूपुरे, चरणी घागरिया ।
    जय देव जय देव जय मंगलमूर्ती ॥२॥
    लंबोदर पीतांबर, फणिवरबंधना ।
    सरळ सोंड, वक्रतुंड त्रिनयना ।
    दास रामाचा, वाट पाहे सदना ।
    संकटी पावावे, निर्वाणी रक्षावे, सुरवरवंदना ।
    जय देव जय देव, जय मंगलमूर्ती ।
    दर्शनमात्रे मन कामना पूर्ती ॥३॥
  roman_simple: |
    Sukhkarta Dukhharta Varta Vighnachi |
    Nurvi Purvi Prem Krupa Jayachi |
    Sarvangi Sundar Uti Shendurachi |
    Kanthi Zhalke Mal Muktaphalanchi || 1 ||
    Jai Dev Jai Dev Jai Mangalmurti |
    Darshanmatre Mankamana Purti || Dhru ||
meaning:
  en: "Giver of joy, remover of sorrow — he leaves no trace of obstacles, and grants love and grace. His whole form is beautiful with vermilion paste; a string of pearls gleams at his throat. Victory to the Lord, victory to Mangalmurti — at the mere sight of him, the heart's desire is fulfilled."
  mr: "सुख देणारा, दुःख हरणारा, विघ्नांची वार्ताही न उरवणारा. सर्वांगावर शेंदुराची उटी, कंठात मोत्यांची माळ. जय देव मंगलमूर्ती — दर्शनानेच मनोकामना पूर्ण होते."
  hi: "सुख देने वाले, दुख हरने वाले, विघ्न का नाम भी न रहने देने वाले. सर्वांग पर सिंदूर का लेप, कंठ में मोतियों की माला. जय मंगलमूर्ति — दर्शन मात्र से मनोकामना पूर्ण होती है."
usage:
  when: "The central Ganpati aarti in Maharashtra. Sung twice daily (morning and evening) during Ganeshotsav, and at every Sankashti."
  count: "Once, followed by Ghalin Lotangan and Mantrapushpanjali."
notes_en: "Composed by Samarth Ramdas (17th c.), public domain. 'दास रामाचा' is the poet signature. Punctuation and minor spellings vary between printed editions — this is a consensus reading, not the only valid one."
